name: 'Loop Engineering Action'
description: 'Enforce circuit breakers, readiness audits, and sandboxing for autonomous loops natively in CI.'
author: 'Cobus Greyling'

inputs:
  pattern:
    description: 'The loop pattern (e.g. ci-sweeper, pr-babysitter, dependency-sweeper)'
    required: true
  command:
    description: 'The actual agent command to run if gates pass'
    required: true
  level:
    description: 'Budget level for circuit breaker (L1, L2, L3)'
    required: false
    default: 'L1'
  sandbox:
    description: 'Run the command inside an ephemeral isolated git worktree (loop-sandbox)'
    required: false
    default: 'false'
  sandbox-shell:
    description: 'Run the sandbox command inside a shell environment (--shell)'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Audit Loop Readiness
      run: npx --yes @cobusgreyling/loop-audit .
      shell: bash

    - name: Check Circuit Breaker
      id: breaker
      run: |
        npx --yes @cobusgreyling/loop-context --check --ledger loop-ledger.json \
          --budget-from-pattern ${{ inputs.pattern }} --budget-level ${{ inputs.level }}
      shell: bash

    - name: Write Agent Command Script
      id: write_command
      env:
        LOOP_COMMAND: ${{ inputs.command }}
      run: |
        script_path="$(mktemp "${RUNNER_TEMP:-/tmp}/loop-action-command.XXXXXX")"
        printf '%s\n' "$LOOP_COMMAND" > "$script_path"
        echo "script-path=$script_path" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Run Agent (Sandbox)
      if: ${{ inputs.sandbox == 'true' }}
      env:
        LOOP_SCRIPT_PATH: ${{ steps.write_command.outputs.script-path }}
        LOOP_SANDBOX_SHELL: ${{ inputs.sandbox-shell }}
      run: |
        if [ "$LOOP_SANDBOX_SHELL" == "true" ]; then
          npx --yes @cobusgreyling/loop-sandbox run --shell -- bash -eo pipefail "$LOOP_SCRIPT_PATH"
        else
          npx --yes @cobusgreyling/loop-sandbox run -- bash -eo pipefail "$LOOP_SCRIPT_PATH"
        fi
      shell: bash

    - name: Run Agent (Direct)
      if: ${{ inputs.sandbox != 'true' }}
      env:
        LOOP_SCRIPT_PATH: ${{ steps.write_command.outputs.script-path }}
      run: bash -eo pipefail "$LOOP_SCRIPT_PATH"
      shell: bash
